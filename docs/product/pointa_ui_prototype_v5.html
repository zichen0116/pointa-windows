.taskbar{height:45px;position:absolute;bottom:0;left:0;right:0;background:#eef3f9db;border-top:1px solid #d7e2efbb;display:flex;align-items:center;justify-content:center;gap:14px;color:#536477}
.taskbar .taskicon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#fff9;border:1px solid #fff}
.taskbar .taskicon svg{width:19px;height:19px}
.taskbar .tray{position:absolute;right:18px;display:flex;align-items:center;gap:14px;font-size:11px}
.taskbar .tray svg{width:15px;height:15px}
.stage>.phone,.stage>.stageWin{z-index:1}

/* ===================== Pointa V4 precise diffs (retained) ===================== */
:root{--theme:#3b3f46;--range-highlight:#9faabd}
.fullPad{top:172px;bottom:182px} /* first-version ~284x336 px touch area */
.fullPager{bottom:70px} /* close the gap to match the v1 touch-and-pagination rhythm */
/* Keep third-generation four-edge editor; expand adjacent rail to meet the inner edge */
.oneWorkspace{display:flex;gap:9px}
.oneWorkspace .touchSector{flex:0 0 calc(76% - 9px);width:calc(76% - 9px)}
.oneWorkspace.rightHand .touchSector{margin-left:auto}
.oneWorkspace:not(.rightHand) .touchSector{margin-right:auto}
.oneWorkspace .rail{position:absolute;right:0;top:0;bottom:0;left:auto;width:24%;z-index:2}
.oneWorkspace.rightHand .rail{left:0;right:auto}
.oneWorkspace.editMode .touchSector{z-index:3}
/* Color theme only changes UI accents. Laser itself remains red. */
.nav button.active:after{background:var(--theme)}
.pager .forward,.rail .forward,.bigPager .forward{background:var(--theme);border-color:var(--theme);box-shadow:0 8px 20px #1017242b}
.editToolbar .done,.primaryAction{background:var(--theme)}
.toggle.on{background:var(--theme)}
.sheetItem.selected{border-color:var(--theme);background:#304055}
.sheetItem svg:last-child{color:var(--range-highlight)}
.inspector input[type=range]{accent-color:var(--range-highlight)}
.inspector label b{color:var(--theme)}
.smallButton.pink{background:#eaf0f6;color:var(--theme)}
.editHandle:before{background:var(--theme);box-shadow:0 0 0 4px #8e99b52b,0 2px 9px #0006}
.editHandle.dragging:before{border-color:var(--range-highlight)}
.editHint{color:#ebd8df}
.swatch.selected{box-shadow:0 0 0 2px #fff}
.themeColors{gap:7px;justify-content:space-between}
.themeColors .swatch{width:29px;height:29px;flex-shrink:0}
.themeNote{font-size:10px;margin-top:11px;color:#b9c6d7}
.themeNote span{color:#7e8ea4}
.settingsV4 .rangeLabel{margin-top:14px}
/* Visible continuous track + fill; match v1 long horizontal sliders */
.settingsV4 input.range{display:block;width:100%;height:22px;margin:10px 0 2px;appearance:none;-webkit-appearance:none;background:transparent;border:0;cursor:pointer}
.settingsV4 input.range::-webkit-slider-runnable-track{height:7px;border-radius:20px;background:linear-gradient(to right,var(--range-highlight) 0%,var(--range-highlight) var(--p),#586579 var(--p),#586579 100%);border:1px solid #7680947d}
.settingsV4 input.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:var(--range-highlight);border:0;margin-top:-6px;box-shadow:0 2px 7px #0004}
.settingsV4 input.range::-moz-range-track{height:7px;background:#586579;border-radius:20px;border:1px solid #7680947d}
.settingsV4 input.range::-moz-range-progress{height:7px;background:var(--range-highlight);border-radius:20px}
.settingsV4 input.range::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--range-highlight)}
.settingsV4 input.range:disabled{opacity:.35;cursor:not-allowed}
.settingsV4 .settingFootnote{font-size:10px;color:#8496ab;line-height:1.5;margin:11px 0 0}
/* V1 palette and detail spacing + V2 device card/CTA layout */
.deviceSettings .deviceHeading{padding-top:2px}
.deviceSettings .deviceSubtitle{font-size:11px;color:#91a2b6;margin:0 0 19px}
.deviceSettings .deviceRow{display:flex;align-items:center;gap:12px;padding:14px 12px;background:#1d2938;border:1px solid #344356;border-radius:17px;margin:0 0 12px}
.deviceSettings .pcPic{width:43px;height:43px;border-radius:11px;background:#2b3c4e;color:#dce6f3;display:grid;place-items:center;flex-shrink:0}
.deviceSettings .deviceDetail{min-width:0;flex:1}
.deviceSettings .deviceDetail b{font-size:12px}
.deviceSettings .deviceDetail small{color:#91a5b9;font-size:10px;display:block;margin-top:4px}
.deviceSettings .status{color:#50d3a6;margin-left:auto}
.deviceSettings .status svg{width:17px;height:17px}
.deviceSettings .primaryAction{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:15px;min-height:50px;color:#fff;width:100%;font-weight:750;font-size:13px}
.deviceSettings .primaryAction svg{width:17px;height:17px}
.deviceSettings .deviceDivider{height:1px;background:#2d3a4a;margin:22px 0}
.deviceSettings .addDeviceTitle{font-size:13px;font-weight:750;color:#d3e0ef;margin:0 0 12px}
.deviceSettings .secondaryAction{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;height:48px;background:#293646;border:1px solid #405065;border-radius:13px;color:#dbe6f2;font-weight:700;font-size:12px;margin:0 0 9px}
.deviceSettings .secondaryAction svg{width:17px;height:17px}
.deviceSettings .hintCard{font-size:10.5px;color:#95a7bb;line-height:1.65;background:#1d2938;border-radius:13px;padding:12px;margin:13px 0 18px}
/* The V2 Windows popup is centered in the V3 stage, original desktop shape. */
.stage.windows #windowsHolder{display:flex;align-items:center;justify-content:center;padding:20px}
.stageWin{width:min(100%,870px);height:575px;position:relative;flex:none}
.stageWin .winWidget{transform:translateX(-50%)}
.stageWin .winHidden{position:absolute;top:155px;left:50%;transform:translateX(-50%);width:365px;text-align:center;padding:30px 20px;background:white;border-radius:16px;z-index:4;box-shadow:0 20px 55px #25395135;color:#243145}
.stageWin .winHidden p{font-size:12px;color:#8391a4}
.stageWin .winHidden button{background:var(--theme);color:#fff;border-radius:10px;padding:10px 15px}
.stageWin .copyCode{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid #e1e7f1;background:#f5f8fc;color:#425571;border-radius:9px;font-size:11px;font-weight:700;padding:9px}
.stageWin .copyCode svg{width:15px;height:15px}
.stageWin .qr i.on{background:#202e3e}
.stageWin .trayLaunch{border:1px solid white;cursor:pointer;color:#51627b}
@media(max-width:760px){.stageWin{max-width:100%}.stageWin .winWidget{transform:translateX(-50%) scale(.84);transform-origin:top center}}
@media(max-width:410px){.stageWin .winWidget{transform:translateX(-50%) scale(.7)}.stageWin .winHidden{width:300px}}

/* ===================== Pointa V5 · two scoped refinements ===================== */
/* WinBody has flex:1; reduce its surplus height below winDev without changing inner cards. */
.stageWin .winWidget{height:410px}
/* The default black is the original subdued, navy control style—not a new gray accent. */
:root.theme-default .pager .forward,
:root.theme-default .rail .forward,
:root.theme-default .bigPager .forward{background:#263246;border-color:#344052;box-shadow:none}
/* Use the OS/browser selection highlight for custom switches and filled sliders. */
:root.theme-default .toggle.on{background:Highlight}
:root.theme-default .inspector input[type=range]{accent-color:auto}
</style>

<body>
<div class="studio">
 <aside class="side"><div class="brand"><div class="mark" id="logo"></div><div><b>映点</b><small>POINTA / UI LAB</small></div></div>
 <div class="sideLabel">ANDROID / 模式</div><nav class="nav" id="nav">
  <button data-view="full" class="active">全屏模式</button><button data-view="one">单手模式</button><button data-view="slides">纯翻页模式</button><button data-view="gyro">陀螺仪模式</button>
  <button data-view="settings">个性化设置</button><button data-view="device">设备连接</button><button data-view="windows">Windows 小窗</button>
 </nav><div class="sideFoot">POINTA · 第五版交互原型<br>局域网演示控制体验设计<br>所有操作均为前端模拟</div></aside>
 <main><div class="headline"><div><div class="eyebrow">POINTA / INTERACTION STUDY</div><h1 id="pageTitle">单手模式</h1></div><span class="tagVersion">UI CONCEPT V5</span></div><div class="stage" id="stage"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div></main>
 <aside class="inspector" id="inspector"></aside>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

(()=>{
'use strict';
const icons={target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M1 12h4m14 0h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19 7-2-2-2 1-2-1V2h-3v3L8 6 6 5 4 7l1 2-1 2H2v3h2l1 2-1 2 2 2 2-1 2 1v2h3v-2l2-1 2 1 2-2-1-2 1-2h2v-3h-2l-1-2z"/>',down:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m14 7-5 5 5 5"/>',right:'<path d="m10 7 5 5-5 5"/>',back:'<path d="m15 18-6-6 6-6"/>',refresh:'<path d="M20 7V3h-4M4 17v4h4"/><path d="M4.5 9A8 8 0 0 1 19 7m.5 8A8 8 0 0 1 5 17"/>',screen:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',edit:'<path d="m14 5 5 5M4 20l4.5-1 11-11a2.2 2.2 0 0 0-3-3l-11 11L4 20z"/>',check:'<path d="m5 12 4 4 10-10"/>',hand:'<path d="M8 12V6a2 2 0 0 1 4 0v4-6a2 2 0 0 1 4 0v7-3a2 2 0 0 1 4 0v6c0 4-2 7-7 7h-2c-2 0-3-1-4-3l-3-4a2 2 0 0 1 3-3l1 1Z"/>',gyro:'<circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3" ry="8"/><path d="M4 12h16"/>',qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3m4 0v3m-6 1h2m0 3h4"/>'};
icons.copy='<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>';
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.target}</svg>`;
const modes={full:'全屏模式',one:'单手模式',slides:'纯翻页模式',gyro:'陀螺仪模式',settings:'个性化设置',device:'设备连接',windows:'Windows 小窗'};
const defaults=()=>({left:{left:0,right:0,top:0,bottom:0},right:{left:0,right:0,top:0,bottom:0}});
const load=(key, fallback)=>{try{let x=JSON.parse(localStorage.getItem(key));return x??fallback}catch(e){return fallback}};
let rects=load('pointa-v4-rects', load('pointa-v3-rects', defaults()));for(const h of ['left','right'])if(!rects[h]||['left','right','top','bottom'].some(k=>!Number.isFinite(rects[h][k])))rects[h]=defaults()[h];
const oldPrefs=load('pointa-v3-prefs',{});
let prefs={theme:'#3b3f46',trail:true,duration:500,sensitivity:60,volumeOn:true,prevKey:'-',nextKey:'+', ...Object.fromEntries(['trail','duration','sensitivity','volumeOn','prevKey','nextKey'].filter(k=>k in oldPrefs).map(k=>[k,oldPrefs[k]])), ...load('pointa-v4-prefs',{})};
if(!['#3b3f46','#ff6475','#32b894','#4d95ed','#d69a47','#b58ae9'].includes(prefs.theme))prefs.theme='#3b3f46';
let pairCode='482916';
let view='full',lastControl='one',hand='left',editing=false,draft=null,modeSheet=false,gyroHeld=false,windowOpen=true;
const $=id=>document.getElementById(id), stage=$('stage'),phone=$('phone'),screen=$('screen'),inspector=$('inspector');
$('logo').innerHTML=icon('target');
function save(){try{localStorage.setItem('pointa-v4-rects',JSON.stringify(rects));localStorage.setItem('pointa-v4-prefs',JSON.stringify(prefs))}catch(e){}}
function message(text){let t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(message.timer);message.timer=setTimeout(()=>t.classList.remove('show'),1500)}
function system(){return `<div class="system"><span>9:41</span><span class="statusGlyph">▂▅▇ ◉ ▰</span></div>`}
function header(){return `<div class="deviceHead"><div class="connected"><i></i>演示电脑 · 已连接</div><div class="headActions"><button type="button" class="iconBtn" data-action="device" aria-label="设备">${icon('screen')}</button><button type="button" class="iconBtn" data-action="settings" aria-label="设置">${icon('settings')}</button></div></div>`}
function modesBar(){return `<div class="modeRow"><button type="button" class="modePicker" data-action="modes">${modes[view]}${icon('down')}</button>${view==='one'?`<div class="modeRight"><div class="handSwitch"><button data-action="hand-left" class="${hand==='left'?'selected':''}">左手</button><button data-action="hand-right" class="${hand==='right'?'selected':''}">右手</button></div><button type="button" class="editShortcut" data-action="begin-edit" title="调整触控区域" aria-label="调整触控区域">${icon('edit')}</button></div>`:''}</div>`}
function laserPad(cls){return `<div class="pad ${cls}" data-pad><span class="laser"></span>${cls==='fullPad'?'<span class="crossHorizontal"></span><span class="crossVertical"></span>':''}</div>`}
function pageButton(which){return `<button type="button" class="${which==='next'?'forward':''}" data-action="${which}">${which==='prev'?icon('left'):''}<span>${which==='prev'?'上一页':'下一页'}</span>${which==='next'?icon('right'):''}</button>`}
function rectStyle(r){return `inset:${r.top}% ${r.right}% ${r.bottom}% ${r.left}%`}
function editToolbar(){return `<div class="editToolbar"><button type="button" class="simple" data-action="cancel-edit">取消</button><strong>调整触控区</strong><button type="button" class="simple resetIcon" data-action="reset-edit" title="恢复默认">${icon('refresh')}</button><button type="button" class="done" data-action="save-edit">保存</button></div>`}
function oneHand(){
 const r=editing?draft:rects[hand];
 return `${system()}${header()}${editing?editToolbar():modesBar()}<div class="oneWorkspace ${hand==='right'?'rightHand':''} ${editing?'editMode':''}"><div class="touchSector" id="touchSector"><div class="pad onePad ${editing?'editing':''}" data-pad style="${rectStyle(r)}"><span class="laser"></span>${editing?['top','right','bottom','left'].map(d=>`<button type="button" class="editHandle" data-edge="${d}" aria-label="调整${{top:'上',right:'右',bottom:'下',left:'左'}[d]}边" title="拖动${{top:'上',right:'右',bottom:'下',left:'左'}[d]}边"></button>`).join(''):''}</div></div><div class="rail">${pageButton('prev')}${pageButton('next')}</div></div><div class="homeBar"></div>`;
}
function full(){return `${system()}${header()}${modesBar()}${laserPad('fullPad')}<div class="pager fullPager">${pageButton('prev')}${pageButton('next')}</div><div class="homeBar"></div>`}
function slides(){return `${system()}${header()}${modesBar()}<div class="bigPager">${pageButton('prev')}${pageButton('next')}</div><div class="homeBar"></div>`}
function gyro(){return `${system()}${header()}${modesBar()}<div class="gyroPad" id="gyroPad"><div class="gyroTarget">${icon('target')}</div><div class="gyroLabel" id="gyroLabel">按住激活指针</div></div><div class="pager gyroPager">${pageButton('prev')}${pageButton('next')}</div><div class="gyroUtility"><button data-action="calibrate">${icon('refresh')}归零校准</button><button data-action="settings">${icon('settings')}灵敏度</button></div><div class="homeBar"></div>`}
const swatches=[
 {name:'黑色 · 默认',value:'#3b3f46'},{name:'珊瑚红',value:'#ff6475'},
 {name:'薄荷绿',value:'#32b894'},{name:'天空蓝',value:'#4d95ed'},
 {name:'暖金色',value:'#d69a47'},{name:'淡紫色',value:'#b58ae9'}
];
const rangeStyle=(v,min,max)=>`style="--p:${Math.round((v-min)/(max-min)*100)}%"`;
function toggle(on,what){return `<button type="button" class="toggle ${on?'on':''}" data-action="${what}" role="switch" aria-checked="${on}"><span></span></button>`}
function settings(){return `${system()}<div class="screenSettings settingsV4">
<button class="backNav" data-action="back">${icon('back')}返回演示</button>
<div class="settingsHeading">个性化设置</div>
<section class="settingsCard"><h3>主题颜色</h3><div class="colors themeColors">${swatches.map(s=>`<button type="button" class="swatch ${prefs.theme===s.value?'selected':''}" data-theme-color="${s.value}" style="background:${s.value==='#3b3f46'?'#111722':s.value}" title="${s.name}" aria-label="${s.name}" aria-pressed="${prefs.theme===s.value}"></button>`).join('')}</div><div class="themeNote">${swatches.find(s=>s.value===prefs.theme)?.name||'黑色 · 默认'}<span> · 页面强调色</span></div></section>
<section class="settingsCard"><div class="settingsRow"><span>渐隐拖尾</span>${toggle(prefs.trail,'trail')}</div><div class="settingsRow rangeLabel"><small>拖尾时间</small><small id="durationValue">${prefs.duration} ms</small></div><input aria-label="拖尾时间" type="range" class="range" id="durationRange" min="100" max="1200" step="50" value="${prefs.duration}" ${rangeStyle(prefs.duration,100,1200)} ${prefs.trail?'':'disabled'}></section>
<section class="settingsCard"><div class="settingsRow"><span>控制灵敏度</span><small id="sensitivityValue">${prefs.sensitivity}%</small></div><input aria-label="控制灵敏度" type="range" class="range" id="sensitivityRange" min="10" max="100" step="5" value="${prefs.sensitivity}" ${rangeStyle(prefs.sensitivity,10,100)}></section>
<section class="settingsCard"><div class="settingsRow"><span>音量键翻页</span>${toggle(prefs.volumeOn,'volume')}</div><div class="settingMap ${prefs.volumeOn?'':'disabled'}"><label for="prevKey">上一页</label><select id="prevKey"><option value="none" ${prefs.prevKey==='none'?'selected':''}>无</option><option value="+" ${prefs.prevKey==='+'?'selected':''}>音量 +</option><option value="-" ${prefs.prevKey==='-'?'selected':''}>音量 −</option></select><label for="nextKey">下一页</label><select id="nextKey"><option value="none" ${prefs.nextKey==='none'?'selected':''}>无</option><option value="+" ${prefs.nextKey==='+'?'selected':''}>音量 +</option><option value="-" ${prefs.nextKey==='-'?'selected':''}>音量 −</option></select></div><p class="settingFootnote">音量键控制在 App 前台可接收按键时生效。</p></section>
</div><div class="homeBar"></div>`;}
function device(){return `${system()}<div class="screenSettings deviceSettings">
<button class="backNav" data-action="back">${icon('back')}返回演示</button>
<div class="settingsHeading deviceHeading">连接设备</div>
<p class="deviceSubtitle">在同一 Wi-Fi 下，快速开始演示</p>
<div class="deviceRow"><div class="pcPic">${icon('screen')}</div><div class="deviceDetail"><b>演示电脑</b><small>最近连接</small></div><div class="status">${icon('check')}</div></div>
<button type="button" class="primaryAction" data-action="connect">继续演示 ${icon('right')}</button>
<div class="deviceDivider"></div>
<div class="addDeviceTitle">添加新设备</div>
<button type="button" class="secondaryAction" data-action="scan">${icon('qr')}扫描二维码</button>
<button type="button" class="secondaryAction" data-action="code">${icon('screen')}输入 6 位设备码</button>
<div class="hintCard">小提示：无法连接时，请确认电脑和手机处于同一局域网。公司或校园访客 Wi-Fi 可能禁止设备间互访。</div>
</div><div class="homeBar"></div>`;}
function sheet(){return `<div class="modeOverlay" id="modeOverlay"><div class="modeSheet"><div class="sheetNotch"></div><div class="sheetTitle">选择控制模式</div>${['full','one','slides','gyro'].map(m=>`<button class="sheetItem ${view===m?'selected':''}" data-view="${m}">${icon(m==='gyro'?'gyro':m==='one'?'hand':'target')} ${modes[m]}${view===m?icon('check'):''}</button>`).join('')}</div></div>`}
function qr(){let html='',s=17,seed=91;const rand=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};for(let y=0;y<s;y++)for(let x=0;x<s;x++){let v=rand()>.5;const finder=(ox,oy)=>{let a=x-ox,b=y-oy;if(a>=0&&b>=0&&a<=5&&b<=5){return a===0||b===0||a===5||b===5||(a>=2&&a<=3&&b>=2&&b<=3)}return null};for(let p of [[0,0],[11,0],[0,11]]){let f=finder(...p);if(f!==null){v=f;break}}html+=`<i class="${v?'on':''}"></i>`}return html}
function windows(){return `<div class="stageWin"><div class="desktopWallpaper"></div>${windowOpen?`
<div class="winWidget" id="winWidget">
 <div class="winTitlebar"><strong><i class="winDot"></i>映点 Pointa</strong><button class="winClose" data-action="hide-win" title="关闭到托盘" aria-label="关闭到托盘">${icon('back')}</button></div>
 <div class="winBody"><div class="winStatus"><i class="stateDot"></i>等待手机连接</div>
 <div class="pairRow"><div class="qr">${qr()}<div class="qrDemo">原型示意</div></div><div class="pairSide"><small>设备码</small><div class="pairCode" id="pairCode">${pairCode.slice(0,3)} ${pairCode.slice(3)}</div><button type="button" class="copyCode" data-action="copycode">${icon('copy')}复制设备码</button></div></div>
 <div class="winDev">${icon('screen')}<span><b>激光覆盖层已就绪</b><small>支持鼠标穿透 · 无需置顶窗口</small></span></div></div>
 <div class="winFooter"><span>局域网 · 等待配对</span><button data-action="refreshcode">刷新配对码</button></div>
</div>`:`<div class="winHidden"><h3>映点已收进系统托盘</h3><p>后台仍在运行（原型模拟）</p><button data-action="open-win">重新打开小窗</button></div>`}
<div class="taskbar"><span class="taskicon">${icon('screen')}</span><button type="button" class="taskicon trayLaunch" data-action="open-win" title="点击映点托盘图标恢复窗口" aria-label="映点托盘图标">${icon('target')}</button><div class="tray">${icon('settings')} <span>Wi-Fi · 21:26</span></div></div></div>`;}
const descriptions={full:'全屏触控区恢复第一版的近似高度（336 px），底部翻页按钮保持独立。',one:'继承第三版的四边独立编辑。与翻页侧栏相邻的触控边界移动时，侧栏宽度同步伸缩。',slides:'保持第三版纯翻页模式布局，下一页触控面积更大。',gyro:'保持第三版按住激活、翻页及归零校准交互。',settings:'默认黑色主题沿用深色翻页按键，开关和长条滑块使用系统默认高亮色；其他五个主题保持不变。',device:'返回栏沿用第三版，最近连接与继续演示沿用第二版排版，下方新增设备入口与提示恢复第一版。',windows:'恢复第二版浅色 Windows 配对小窗、二维码与设备码并列布局、托盘恢复和刷新操作。'};
function panel(){if(view==='one'){const r=editing?draft:rects[hand];return `<div class="infoCard"><h3>单手触控 · 四边调整</h3><p>点击手机模式栏右侧的编辑图标。拖动四边圆点，触控区域立即按新边界显示；保存后只影响当前惯用手。</p><div class="statRow"><span>当前布局</span><strong>${hand==='left'?'左手':'右手'} · ${editing?'编辑中':'已保存'}</strong></div><div class="statRow"><span>左右边距</span><strong>${Math.round(r.left)}% / ${Math.round(r.right)}%</strong></div><div class="statRow"><span>上下边距</span><strong>${Math.round(r.top)}% / ${Math.round(r.bottom)}%</strong></div><button class="smallButton pink" data-action="${editing?'save-edit':'begin-edit'}">${icon('edit')}${editing?'保存当前区域':'编辑触控区域'}</button>${editing?`<button class="smallButton" data-action="reset-edit">${icon('refresh')}恢复默认区域</button>`:''}</div><div class="infoCard"><h3>精细调整 · 当前预览</h3>${['top','right','bottom','left'].map(k=>`<label for="edge-${k}"><span>${{top:'上边',right:'右边',bottom:'下边',left:'左边'}[k]}</span><b id="value-${k}">${Math.round(r[k])}%</b></label><input id="edge-${k}" type="range" data-edge-slider="${k}" min="0" max="45" step="1" value="${r[k]}" ${editing?'':'disabled'}>`).join('')}<div class="hint">调整量为相对于当前触控区容器的内缩百分比。编辑状态下拖边与滑块保持同步，左右手配置分别保存。</div></div>`}return `<div class="infoCard"><h3>设计逻辑</h3><p>${descriptions[view]}</p></div><div class="infoCard"><h3>交互状态</h3>${[['主题色',swatches.find(s=>s.value===prefs.theme)?.name||'黑色 · 默认'],['产品重点',view==='settings'?'自定义配置':'可预测、少误触'],['交付范围','可交互 UI 原型']].map(x=>`<div class="statRow"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}<p class="hint">此原型未连接 Windows 或安卓传感器。翻页提示、激光光点和设备码均为模拟。</p></div>`}
function render(){const isDefaultTheme=prefs.theme==='#3b3f46';document.documentElement.classList.toggle('theme-default',isDefaultTheme);document.documentElement.style.setProperty('--theme',isDefaultTheme?'#263246':prefs.theme);document.documentElement.style.setProperty('--range-highlight',isDefaultTheme?'Highlight':prefs.theme);if(view!=='one'){editing=false;draft=null}if(view==='windows'){stage.classList.add('windows');$('phone').style.display='none';let el=$('windowsHolder');if(!el){el=document.createElement('div');el.id='windowsHolder';el.style.cssText='position:absolute;inset:0';stage.appendChild(el)}el.innerHTML=windows()}else{stage.classList.remove('windows');const el=$('windowsHolder');if(el)el.remove();$('phone').style.display='block';screen.innerHTML=({one:oneHand,full,slides,gyro,settings,device}[view]||full)()+(modeSheet?sheet():'');screen.style.setProperty('--laser','#ff6475');if(view==='one'){syncRail();if(editing)screen.querySelectorAll('.editHandle').forEach(h=>attachHandle(h));}if(view==='gyro')attachGyro();if((view==='one'||view==='full')&&!editing)attachTouch()}
 $('pageTitle').textContent=modes[view];document.querySelectorAll('.nav [data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===view));inspector.innerHTML=panel()}

function syncRail(){
 if(view!=='one')return;
 const ws=screen.querySelector('.oneWorkspace'),sector=screen.querySelector('#touchSector'),rail=screen.querySelector('.rail');
 if(!ws||!sector||!rail)return;
 const r=editing?draft:rects[hand],near=hand==='right'?'left':'right';
 const baseline=ws.clientWidth-sector.clientWidth-9;
 rail.style.width=`${Math.max(35,baseline+sector.clientWidth*r[near]/100)}px`;
}
window.addEventListener('resize',()=>{if(view==='one')syncRail()});

function updateRegion(){
 if(!editing||view!=='one')return;
 const pad=screen.querySelector('.onePad');if(pad)pad.style.cssText=rectStyle(draft);
 const stats=inspector.querySelectorAll('.statRow strong');
 if(stats[1])stats[1].textContent=`${Math.round(draft.left)}% / ${Math.round(draft.right)}%`;
 if(stats[2])stats[2].textContent=`${Math.round(draft.top)}% / ${Math.round(draft.bottom)}%`;
 syncRail();
 for(const edge of ['top','right','bottom','left']){
  const value=$('value-'+edge);if(value)value.textContent=Math.round(draft[edge])+'%';
  const slider=$('edge-'+edge);if(slider)slider.value=draft[edge];
 }
}
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function moveEdge(edge,e){if(!editing)return;const box=$('touchSector').getBoundingClientRect();let x=clamp((e.clientX-box.left)/box.width*100,0,100),y=clamp((e.clientY-box.top)/box.height*100,0,100);switch(edge){case 'top':draft.top=clamp(y,0,100-draft.bottom-40);break;case 'bottom':draft.bottom=clamp(100-y,0,100-draft.top-40);break;case 'left':draft.left=clamp(x,0,100-draft.right-42);break;case 'right':draft.right=clamp(100-x,0,100-draft.left-42);break;}updateRegion()}
function attachHandle(node){let edge=node.dataset.edge;node.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();node.setPointerCapture(e.pointerId);node.classList.add('dragging')});node.addEventListener('pointermove',e=>{if(node.hasPointerCapture(e.pointerId))moveEdge(edge,e)});node.addEventListener('pointerup',()=>node.classList.remove('dragging'));node.addEventListener('pointercancel',()=>node.classList.remove('dragging'));node.addEventListener('keydown',e=>{let n=(e.key==='ArrowRight'||e.key==='ArrowDown')?1:(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:0;if(!n)return;e.preventDefault();let other=(edge==='left'?'right':edge==='right'?'left':edge==='top'?'bottom':'top');let minSize=(edge==='left'||edge==='right')?42:40;draft[edge]=clamp(draft[edge]+n,0,100-draft[other]-minSize);updateRegion()})}
function attachTouch(){const p=screen.querySelector('[data-pad]');if(!p)return;const laser=p.querySelector('.laser');function mark(e){const b=p.getBoundingClientRect();let x=clamp((e.clientX-b.left)/b.width*100,0,100),y=clamp((e.clientY-b.top)/b.height*100,0,100);laser.style.left=x+'%';laser.style.top=y+'%';laser.classList.add('visible');if(prefs.trail){let d=document.createElement('span');d.className='dot';d.style.left=`calc(${x}% - 3px)`;d.style.top=`calc(${y}% - 3px)`;p.appendChild(d);setTimeout(()=>d.remove(),570)}}p.addEventListener('pointerdown',e=>{p.setPointerCapture(e.pointerId);mark(e)});p.addEventListener('pointermove',e=>{if(p.hasPointerCapture(e.pointerId))mark(e)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])p.addEventListener(ev,()=>laser.classList.remove('visible'))}
function attachGyro(){let el=$('gyroPad');if(!el)return;el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);gyroHeld=true;el.classList.add('held');$('gyroLabel').textContent='指针已激活'});const up=()=>{gyroHeld=false;el.classList.remove('held');$('gyroLabel').textContent='按住激活指针'};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
function doAction(a){switch(a){case 'modes':modeSheet=true;render();break;case 'settings':if(!['device','settings'].includes(view))lastControl=view;view='settings';modeSheet=false;render();break;case 'device':if(!['device','settings'].includes(view))lastControl=view;view='device';modeSheet=false;render();break;case 'back':view=lastControl;render();break;case 'hand-left':hand='left';render();break;case 'hand-right':hand='right';render();break;case 'begin-edit':draft={...rects[hand]};editing=true;render();break;case 'save-edit':if(editing){rects[hand]={...draft};save();editing=false;draft=null;render();message('触控区域已保存')}break;case 'cancel-edit':editing=false;draft=null;render();break;case 'reset-edit':draft={...defaults()[hand]};updateRegion();break;case 'prev':message('已发送：上一页');break;case 'next':message('已发送：下一页');break;case 'calibrate':message('已校准 · 原型演示');break;case 'trail':prefs.trail=!prefs.trail;save();render();break;case 'volume':prefs.volumeOn=!prefs.volumeOn;save();render();break;case 'connect':view=lastControl;render();message('已返回演示（模拟连接）');break;case 'scan':message('扫码入口 · UI 示意');break;case 'code':{let code=prompt('输入六位设备码','482916');if(code!==null)message(/^\d{6}$/.test(code.replace(/\s/g,''))?'设备码已提交（模拟）':'请输入六位数字');break}case 'refreshcode':pairCode=String(100000+Math.floor(Math.random()*900000));render();message('配对码已更新（模拟）');break;case 'copycode':if(navigator.clipboard?.writeText){navigator.clipboard.writeText(pairCode).then(()=>message('设备码已复制')).catch(()=>message('设备码：'+pairCode));}else message('设备码：'+pairCode);break;case 'hide-win':windowOpen=false;render();break;case 'open-win':windowOpen=true;render();break;}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-view],[data-action],[data-theme-color]');if(c){if(c.dataset.view){view=c.dataset.view;modeSheet=false;editing=false;draft=null;if(['full','one','slides','gyro'].includes(view))lastControl=view;render()}else if(c.dataset.action)doAction(c.dataset.action);else if(c.dataset.themeColor){prefs.theme=c.dataset.themeColor;save();render()}}else if(e.target.id==='modeOverlay'){modeSheet=false;render()}});
document.addEventListener('input',e=>{if(e.target.id==='durationRange'){prefs.duration=Number(e.target.value);$('durationValue').textContent=prefs.duration+' ms';e.target.style.setProperty('--p',Math.round((prefs.duration-100)/1100*100)+'%');save()}else if(e.target.id==='sensitivityRange'){prefs.sensitivity=Number(e.target.value);$('sensitivityValue').textContent=prefs.sensitivity+'%';e.target.style.setProperty('--p',Math.round((prefs.sensitivity-10)/90*100)+'%');save()}else if(e.target.dataset.edgeSlider){const k=e.target.dataset.edgeSlider;if(!editing)return;let pair=k==='top'?'bottom':k==='bottom'?'top':k==='left'?'right':'left',min=['left','right'].includes(k)?42:40;draft[k]=clamp(Number(e.target.value),0,100-draft[pair]-min);updateRegion()}});
document.addEventListener('change',e=>{if(e.target.id!=='prevKey'&&e.target.id!=='nextKey')return;const which=e.target.id==='prevKey'?'prevKey':'nextKey',other=which==='prevKey'?'nextKey':'prevKey';prefs[which]=e.target.value;if(prefs[which]!=='none'&&prefs[which]===prefs[other]){prefs[other]='none';message('重复按键已自动解除另一项绑定')}save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(editing){doAction('cancel-edit');return}if(modeSheet){modeSheet=false;render();return}}if(view==='settings'||view==='windows'||view==='device'||!prefs.volumeOn)return;const key=e.key==='+'?'+' :e.key==='-'?'-':e.code==='NumpadAdd'?'+':e.code==='NumpadSubtract'?'-':null;if(!key)return;let action=key===prefs.prevKey?'prev':key===prefs.nextKey?'next':null;if(action){e.preventDefault();doAction(action)}});
render();
})();

</script>
